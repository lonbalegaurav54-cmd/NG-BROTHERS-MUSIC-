<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NG BROTHERS MUSIC</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif}
header{background:#080a0e;border-bottom:1px solid #222;padding:14px}
.nav{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:900;font-size:19px;color:#ffd43b}
.pill{border:1px solid #ffd43b;color:#ffd43b;border-radius:20px;padding:8px 12px}
.wrap{max-width:900px;margin:auto;padding:16px}
.hero{background:#11151d;border:1px solid #343b50;border-radius:22px;padding:24px;text-align:center}
.profile{width:min(230px,65vw);aspect-ratio:1;object-fit:cover;border-radius:50%;display:block;margin:0 auto 16px}
.hero h1{font-size:clamp(28px,7vw,52px);margin:8px 0;color:#fff}
.hero h1 span{color:#ffd43b}
.sectionTitle{font-size:23px;margin:26px 0 13px}
.music{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.musicCard{background:#151a23;border:1px solid #293044;border-radius:18px;padding:12px}
.cover{height:105px;border-radius:12px;background:#202738;display:flex;align-items:center;justify-content:center;font-size:52px}
.musicCard h3{margin:9px 0 3px}
.musicCard p{color:#9da6b7;margin:0 0 10px}
.play{width:100%;border:0;border-radius:12px;padding:12px;background:#ffd43b;color:#111;font-weight:800}
.player{position:fixed;bottom:10px;left:10px;right:10px;max-width:900px;margin:auto;background:#151a23;border:1px solid #343b50;border-radius:20px;padding:12px;display:flex;align-items:center;gap:12px}
.disc{width:45px;height:45px;border-radius:12px;background:#ffd43b;color:#111;display:flex;align-items:center;justify-content:center;font-size:22px}
.player strong{display:block}.player small{color:#9da6b7}
.controls{margin-left:auto;display:flex;gap:7px}
.controls button{border:1px solid #3b4350;background:#0d1118;color:#fff;border-radius:10px;padding:10px}
footer{text-align:center;color:#70798a;padding:28px 0 110px;font-size:12px}
@media(max-width:520px){.music{grid-template-columns:repeat(2,minmax(0,1fr))}.musicCard h3{font-size:17px}}
</style>
</head>
<body>
<header><div class="nav">
  <div class="brand">🎵 NG BROTHERS</div>
  <div class="pill">🎵 MUSIC</div>
</div></header>

<div class="wrap">
<section class="hero">
  <img class="profile" src="gaurav.png" alt="Gaurav">
  <h1>NG BROTHERS<br><span>MUSIC</span></h1>
</section>

<h2 class="sectionTitle">🎵 Music Playlists</h2>
<div class="music">
  <div class="musicCard"><div class="cover">💿</div><h3>90s Hits</h3><p>Old is Gold</p><button class="play" onclick="playDemo()">▶ PLAY</button></div>
  <div class="musicCard"><div class="cover">🎶</div><h3>Marathi Hits</h3><p>Marathi Music</p><button class="play" onclick="playDemo()">▶ PLAY</button></div>
  <div class="musicCard"><div class="cover">🎤</div><h3>Evergreen Hits</h3><p>Timeless Classics</p><button class="play" onclick="playDemo()">▶ PLAY</button></div>
  <div class="musicCard"><div class="cover">⭐</div><h3>NG Brothers Special</h3><p>Featured Playlist</p><button class="play" onclick="playDemo()">▶ PLAY</button></div>
</div>

<footer>© 2026 NG BROTHERS MUSIC</footer>
</div>

<div class="player">
  <div class="disc">🎧</div>
  <div><strong>NG BROTHERS MUSIC</strong><small id="status">No audio connected yet</small></div>
  <div class="controls"><button onclick="prev()">⏮</button><button onclick="playDemo()">▶</button><button onclick="next()">⏭</button></div>
</div>

<audio id="audio" src="ng_brothers_demo_music.wav"></audio>
<script>
const audio=document.getElementById('audio');
const status=document.getElementById('status');
function playDemo(){if(audio.paused){audio.play().then(()=>status.textContent='Playing demo audio').catch(()=>status.textContent='Audio file not available');}else{audio.pause();status.textContent='Paused';}}
function prev(){audio.currentTime=0}
function next(){audio.currentTime=0;playDemo()}
</script>
</body>
</html>
